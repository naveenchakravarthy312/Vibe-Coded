<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1f232b"/>
      <stop offset="100%" stop-color="#121316"/>
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Canvas Card -->
  <rect x="12" y="12" width="232" height="232" rx="52" fill="url(#bgGrad)" stroke="#2b313d" stroke-width="4"/>

  <!-- Subtle Inner Ring -->
  <rect x="20" y="20" width="216" height="216" rx="44" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="2"/>

  <!-- Play / Media badge in top-left subtle corner -->
  <circle cx="68" cy="68" r="14" fill="#2b313d" />
  <polygon points="64,60 76,68 64,76" fill="#e0e0e0" />

  <!-- Download Arrow -->
  <g filter="url(#glow)">
    <!-- Stem -->
    <rect x="116" y="70" width="24" height="66" rx="12" fill="url(#arrowGrad)" />
    <!-- Head -->
    <path d="M84 126 L128 168 L172 126" fill="none" stroke="url(#arrowGrad)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Bottom Tray / Bracket -->
  <path d="M72 178 L72 192 C72 196.4 75.6 200 80 200 L176 200 C180.4 200 184 196.4 184 192 L184 178" fill="none" stroke="#e0e0e0" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
